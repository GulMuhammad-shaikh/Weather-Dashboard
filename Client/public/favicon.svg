<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wpSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="wpCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="wpPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="wpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="wpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0369a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Glowing Sun in background -->
  <circle cx="41" cy="23" r="13" fill="url(#wpSunGrad)" filter="url(#wpGlow)" />
  <!-- Sun rays -->
  <path d="M41 5v3M41 41v3M59 23h-3M23 23h-3M53.7 10.3l-2.1 2.1M30.4 33.6l-2.1 2.1M53.7 35.7l-2.1-2.1M30.4 12.4l-2.1-2.1" 
        stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Cloud in foreground with soft drop shadow -->
  <path d="M46 45H19a11 11 0 0 1-2.5-21.7A14 14 0 0 1 43.6 25 10 10 0 0 1 46 45z" 
        fill="url(#wpCloudGrad)" filter="url(#wpShadow)" />

  <!-- WeatherPulse Cyan Accent Droplets -->
  <circle cx="27" cy="52" r="2.8" fill="url(#wpPulseGrad)" />
  <circle cx="37" cy="52" r="2.3" fill="url(#wpPulseGrad)" opacity="0.85" />
</svg>
